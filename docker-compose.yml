version: "3.8"

services:
  autocare-backend:
    build: .
    container_name: autocare-app
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=host.docker.internal
      - MILVUS_HOST=host.docker.internal
      - OLLAMA_HOST=host.docker.internal
    restart: unless-stopped
    # Uncomment below if you want to mount volumes for development
    # volumes:
    #   - .:/app
    #   - /app/__pycache__
