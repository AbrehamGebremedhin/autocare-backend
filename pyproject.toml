[project]
name = "autocare-backend"
version = "0.1.0"
description = "AutoCare FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "supabase==2.15.1",
    "slowapi==0.1.9",
    "PyJWT==2.10.1",
    "email-validator==2.2.0",
    "openai==1.82.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.4",
    "aiofiles==24.1.0",
    "tenacity==9.1.2",
    "chardet==5.2.0",
    "pypdf==5.4.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-mock==3.14.0",
    "pytest-cov==6.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
# PyTest configuration for AutoCare backend

# Test discovery
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test execution
addopts = [
    "-v",                           # Verbose output
    "--strict-markers",             # Strict marker usage
    "--tb=short",                   # Short traceback format
    "--show-capture=no",            # Don't show captured output unless test fails
    "--disable-warnings",           # Disable pytest warnings
    "--color=yes",                  # Colored output
    "--durations=10",               # Show 10 slowest tests
]

# Markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "database: marks tests that require database",
    "external: marks tests that require external services",
    "asyncio: marks tests that use asyncio",
    "parametrize: marks parametrized tests",
    "smoke: marks tests as smoke tests",
    "regression: marks tests as regression tests",
    "performance: marks tests as performance tests",
]

# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test timeout (in seconds)
timeout = 30
timeout_method = "thread"

# Coverage settings (when using pytest-cov)
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
    "app/db/migration.py",
]

[tool.coverage.report]
# Fail if coverage is below this percentage
fail_under = 80

# Show missing lines in coverage report
show_missing = true

# Exclude lines from coverage
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
    "except ModuleNotFoundError:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Logging configuration for tests
[tool.pytest.logging]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Capture log output for failed tests
log_capture = true
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

# Filterwarnings
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    "ignore:.*deprecated.*:DeprecationWarning",
    "ignore:.*asyncio.*:DeprecationWarning",
]

# Test data directory
testmon_datadir = ".testmondata"

# Minimum Python version for tests
minversion = "6.0"

# Require at least this version of pytest
required_plugins = [
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]

# Mock configuration
mock_use_standalone_module = true
