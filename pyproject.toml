[project]
name = "autocare-backend"
version = "0.1.0"
description = "AutoCare FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.33",
    "slowapi==0.1.9",
    "PyJWT==2.15.1",
    "email-validator==2.2.0",
    "openai==1.82.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.4",
    "pypdf==7.0.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "torch==2.7.1",
    "transformers==4.53.0",
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 passes metadata_errors to av.open, which av>=19 rejects
    "av==16.1.0",
    "asyncpg==0.32.0",
    "argon2-cffi==25.1.0",
    "google-auth==2.62.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-mock==3.14.0",
    "pytest-cov==6.0.0",
    "pyyaml>=6.0.3",
    "ruff==0.17.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
# PyTest configuration for AutoCare backend

# Test discovery
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test execution
addopts = [
    "-v",                           # Verbose output
    "--strict-markers",             # Strict marker usage
    "--tb=short",                   # Short traceback format
    "--show-capture=no",            # Don't show captured output unless test fails
    "--disable-warnings",           # Disable pytest warnings
    "--color=yes",                  # Colored output
    "--durations=10",               # Show 10 slowest tests
    "-m", "not slow and not db",    # Skip real-model and real-database tests unless selected with -m
]

# Markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "db: needs a real Postgres in TEST_DATABASE_URL (run with -m db)",
    "asyncio: marks tests that use asyncio",
]

# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage settings (when using pytest-cov)
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
# Fail if coverage is below this percentage
fail_under = 80

# Show missing lines in coverage report
show_missing = true

# Exclude lines from coverage
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
    "except ModuleNotFoundError:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
