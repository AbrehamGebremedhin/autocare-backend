# Quality cases for scripts/run_cases.py. Fields:
#   id, car_id, text, must_mention, must_not, expects_citation,
#   media (optional): paths under tests/fixtures/e2e/. Media cases are skipped while the files are missing.
#   history (optional): earlier findings for the car, each {kind, text, source, date}: what a previous session stored.
# The must_not list is the same for every case, so it is anchored once here.
- id: overheat-fan-cycling
  car_id: toyota-echo-2001
  text: >-
    My car is overheating and the cooling fan keeps clicking on and off. The temperature
    gauge climbs in traffic and drops when I drive faster. What could be wrong?
  must_mention: ["temperature sensor", "relay", "coolant level"]
  must_not: &must_not ["check your owner's manual", "refer to your manual", "here's a message"]
  expects_citation: true

- id: reservoir-steam
  car_id: toyota-echo-2001
  text: >-
    I see steam coming out of the coolant reservoir after a drive and the coolant level
    keeps dropping. What is happening and is it safe to keep driving?
  must_mention: ["radiator cap", "head gasket"]
  must_not: *must_not
  expects_citation: true

- id: brake-grinding
  car_id: toyota-echo-2001
  text: >-
    There is a grinding noise from the front wheels every time I press the brake pedal,
    and the car pulls slightly to one side when I stop.
  must_mention: ["brake pad", "rotor"]
  must_not: *must_not
  expects_citation: false

- id: no-start-clicking
  car_id: toyota-echo-2001
  text: >-
    The car will not start. When I turn the key I only hear a fast clicking sound and the
    dashboard lights dim.
  must_mention: ["battery", "starter"]
  must_not: *must_not
  expects_citation: false

- id: rough-idle
  car_id: toyota-echo-2001
  text: >-
    The engine idles roughly and shakes at traffic lights, and sometimes the RPM needle
    bounces. It runs fine once I am driving.
  must_mention: ["spark plug", "vacuum"]
  must_not: *must_not
  expects_citation: false

- id: check-engine-light
  car_id: toyota-echo-2001
  text: >-
    The check engine light came on and stays on. The car drives normally. What should I
    do and how serious is it?
  must_mention: ["code", "gas cap"]
  must_not: *must_not
  expects_citation: false

# Media cases. The files are not in the repo: supply real clips (generated tones only
# check the pipeline and say nothing about quality).
- id: photo-coolant-reservoir
  car_id: toyota-echo-2001
  text: This is the coolant reservoir after a drive. Is the level and colour normal?
  media: [tests/fixtures/e2e/coolant-reservoir.jpg]
  must_mention: ["coolant"]
  must_not: *must_not
  expects_citation: false

- id: audio-engine-noise
  car_id: toyota-echo-2001
  text: This is the noise my engine makes when I start it cold.
  media: [tests/fixtures/e2e/engine-noise.m4a]
  must_mention: ["belt"]
  must_not: *must_not
  expects_citation: false

- id: video-engine-bay
  car_id: toyota-echo-2001
  media: [tests/fixtures/e2e/engine-bay.mp4]
  must_mention: ["engine"]
  must_not: *must_not
  expects_citation: false

# History case: synthetic findings from an "earlier session" (no real data). The complaint itself says "hub" but
# not "rear-left" or "bearing", so those two can only come from the history.
- id: abs-after-new-hub
  car_id: toyota-echo-2001
  history:
    - {kind: confirmed_finding, source: user_confirmed, date: 2026-11-02, text: "rear-left wheel bearing worn, confirmed by wheel-off spin test"}
    - {kind: repair_done, source: user_confirmed, date: 2026-11-05, text: "new rear-left hub fitted"}
  text: ABS light comes on over bumps after the new hub
  must_mention: ["rear-left", "bearing", "sensor"]
  must_not: *must_not
  expects_citation: false

# Clarify-gate cases. All synthetic: `seeded_media` sends a placeholder file through the real turn, `observations` stands in
# for hearing (transcript, sound tags, signal numbers) and `frames` names a Pillow drawing for the video frames.
# `messages` seeds earlier turns; `pending_clarification: true` makes the last one (an assistant question) the pending
# question. `expects_clarify` says whether a clarify event is wanted; `must_not_name` lists words the reply must not use.
- id: clarify-noise-unrelated-frames
  car_id: toyota-echo-2001
  text: There is a noise when I drive. I filmed it.
  seeded_media: video
  frames: [door-seam]
  observations:
    transcript: ""
    sounds: [{label: engine knocking, score: 0.25}]
    signal: {seconds: 8.0, rms_dbfs: -31.0, speech_only: false, top_scores: [0.25, 0.21, 0.08], margin: 0.04}
  expects_clarify: true
  must_mention: ["?"]
  must_not_name: ["panel gap", "door seam", "door panel", "the seam"]
  must_not: *must_not
  expects_citation: false

- id: clarify-clear-text-no-media
  car_id: toyota-echo-2001
  text: >-
    There is a grinding noise from the front wheels every time I press the brake pedal, and the car pulls
    slightly to one side when I stop.
  expects_clarify: false
  must_mention: ["brake pad"]
  must_not: *must_not
  expects_citation: false

- id: clarify-clear-speech-in-media
  car_id: toyota-echo-2001
  seeded_media: audio
  observations:
    transcript: >-
      This is the front left wheel. Every time I brake I hear a grinding noise and the car pulls to the left. It started
      after I fitted new brake pads last week.
    sounds: []
    signal: {seconds: 12.0, rms_dbfs: -27.0, speech_only: true, top_scores: [0.12, 0.1, 0.07], margin: 0.02}
  expects_clarify: false
  must_mention: ["brake"]
  must_not: *must_not
  expects_citation: false

- id: clarify-abs-light-unclear-audio
  car_id: toyota-echo-2001
  text: The ABS light is on and I recorded a noise.
  seeded_media: audio
  observations:
    transcript: ""
    sounds: []
    signal: {seconds: 1.4, rms_dbfs: -58.0, speech_only: false, top_scores: [0.09, 0.08, 0.07], margin: 0.01}
  expects_clarify: true
  must_mention: ["driving"]
  must_not: *must_not
  expects_citation: false

# The two cases below continue the first one: the user sent a clip, the app asked, and this message is the answer.
- id: clarify-answer-dont-know
  car_id: toyota-echo-2001
  text: I don't know
  messages: &asked_moving
    - role: user
      content: There is a noise when I drive. I filmed it.
      media: [{kind: video, path: seed/0.mp4}]
      observations:
        transcript: ""
        sounds: [{label: engine knocking, score: 0.25}]
        seen: a close-up of a door seam between two panels
    - role: assistant
      content: "Was the car moving when this happened, and how fast?\n1. Parked or stopped\n2. Slowly (under 30 km/h)\n3. Around town (30 to 70 km/h)\n4. Faster (over 70 km/h)\nOr tell me in your own words."
      clarify:
        question: Was the car moving when this happened, and how fast?
        reason: frames_unrelated_to_noise
        question_id: moving
        options: [{id: stationary, label: Parked or stopped}, {id: slow, label: Slowly (under 30 km/h)}, {id: town, label: Around town (30 to 70 km/h)}, {id: fast, label: Faster (over 70 km/h)}]
  pending_clarification: true
  expects_clarify: false
  max_questions: 0
  must_mention: ["speed"]
  must_not: *must_not
  expects_citation: false

- id: clarify-answer-with-speed
  car_id: toyota-echo-2001
  text: about 90 km/h
  messages: *asked_moving
  pending_clarification: true
  expects_clarify: false
  max_questions: 0
  must_mention: ["90"]
  must_not: *must_not
  expects_citation: false
