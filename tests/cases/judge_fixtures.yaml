    3. **Tyres.** Cupped, scalloped or feathered tread, a flat spot, or a lost balance weight hums in a narrow speed band and doesn't care which way you steer. It explains a hum at 60 km/h that fades above and below that speed. *Next check:* run your hand around each tyre tread (both directions) looking for scalloping or uneven wear, check pressures, and swap the suspect wheel front-to-rear — if the noise moves, it's the tyre/wheel.

    4. **Brake drag.** A sticking caliper or a dust shield touching the disc gives a hum or whirr that changes when you apply the brakes lightly. *Next check:* after a normal drive, carefully feel (don't grab) each wheel centre for heat — one noticeably hotter wheel points to drag. Then at 60 km/h touch the brakes lightly and see whether the hum changes.

