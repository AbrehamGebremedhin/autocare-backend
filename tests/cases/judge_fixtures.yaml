    **Likely causes, ranked**

    1. **A wheel bearing — possibly the one just fitted on the left, or a bearing on another corner.** This fits the reported symptom directly: a steady hum that comes in around 60 km/h and rises in pitch as you go faster is the classic bearing signature. The new hub was fitted on 2026-11-05, so a bearing damaged during pressing, seated crooked, or a hub nut not torqued correctly is a real possibility; equally, the now-quiet left side can simply reveal a worn bearing elsewhere. *Check:* on a quiet road at about 60 km/h, weave gently left, then right. Noise louder when you turn right (weight off the left) points to the left bearing; louder turning left points to the right side. Then jack that corner, spin the wheel by hand and listen, and rock it holding the tyre at 12 and 6 o'clock to feel for play.
