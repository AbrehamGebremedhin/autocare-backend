    A steady hum at 60 km/h that is speed-related rather than engine-related is usually tire or wheel-bearing noise. No Reference passage covers wheel bearings, hub replacement or tire noise on this car, so the points below are general guidance, not checked for this car.

    Nothing here suggests you need to stop driving, but if the hum ever comes with a shudder through the steering wheel, a pull to one side, or a change in braking, treat it as urgent and get it looked at.

    **Ranked causes**

    1. **Tire noise — cupping or scalloped tread, or a damaged tire.** Fits a steady hum that peaks around a specific road speed and sounds "different" from the old bearing growl. The tire that ran with the worn rear-left bearing may have worn unevenly, and if it was moved to another corner the noise moves with it. Next check: with the engine off, run your flat hand slowly around the tread of each tire feeling for sawtooth or scalloped blocks, and look for a bulge or flat spot. Then swap front to rear and see whether the noise changes location or pitch.

    2. **A wheel bearing at a different corner (front, or rear-right).** Fits a speed-dependent hum with no other symptom; a worn bearing can hum with no play detectable by hand. Next check: at about 60 km/h, gently sweep the car left and then right. The bearing on the loaded side (turning right loads the left side) gets louder. Then with the car safely jacked and supported, spin each wheel and feel for roughness, and rock it at 12–6 and 3–9 o'clock for play.

    3. **The recently fitted left hub/bearing.** Only fits if the hum sits at that same corner and started after the repair — a new bearing can be noisy from new, or can be damaged if it was pressed in incorrectly. I have no torque or fitting spec for this car in the excerpts. Next check: confirm whether the sound is at that corner, and whether the original noise went away after the hub was fitted.

    4. **Exhaust drone or a dragging brake.** Less likely for a clean hum, but easy to rule out: coast in neutral at 60 km/h on a quiet road. If the hum disappears the moment you lift off, it is not tire or bearing.

    **Two questions**
    - Which corner does the hum seem to come from, and does it get louder when you steer gently one way versus the other?
    - Did the original noise go away after the new left hub was fitted? The history does not say what that repair achieved.
