    4. **Driveline (CV joint or differential).** Less likely for a pure hum — CV joints usually click on turns, and differential whine follows engine rpm rather than road speed. *Check:* hold a steady 60 km/h in a lower gear at higher rpm; if the pitch doesn't change, it's not driveline.

