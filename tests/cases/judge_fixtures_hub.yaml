    A hum that appears at a particular road speed (60 km/h) usually comes from a wheel-end or tire source, not the engine — and since the left hub was fitted on 2026-11-05, that work is the first thing to look at.

    First, a quick way to separate engine from driveline: with the car stationary, parking brake on, in neutral (Park on an automatic), rev the engine slightly and see whether the hum follows engine speed (Haynes Diesel Engine Repair Manual, p. 280). If it doesn't, it's road-speed related and the wheels/tires are the place to look. I don't know from the history whether the earlier rear-left bearing noise went away after the hub was fitted — that's one of my questions below.

    The reference passages say nothing specific about the Echo's wheel bearings, hub nut torque or tire specifications, so the checks below are general guidance, not checked for this car.

    **Ranked causes**

    1. **The newly fitted left hub/bearing (or how it was installed).** A part fitted days before a new noise started is a prime suspect; a bearing damaged during pressing, a hub nut not torqued to spec, or a mismatched part can hum exactly like a worn one. *Check:* after a 10–15 minute drive at 60 km/h, stop and feel each wheel centre/hub with the back of your hand — a noticeably hotter corner points there. Also confirm the wheel nuts are correctly torqued.
    2. **Tire noise (cupping, feathering, uneven wear, or a tire moved during the hub work).** This fits a hum that appears in a fairly narrow speed band and changes with road surface. *Check:* run a hand around the tread of each tire feeling for sawtooth/scalloped blocks, and swap front-to-rear tires — if the hum moves or changes, it's tire-related.
    3. **A different wheel bearing (front-left, or either right-hand corner).** Fits because a bearing hum is road-speed related and can sound "different" from the earlier one. *Check (most discriminating test):* at about 60 km/h on a clear road, gently swerve left, then right. A bearing gets louder when that corner is loaded and quieter when unloaded; tire noise usually doesn't change much either way. Note which direction makes it worse — that identifies the corner.
    4. **A dragging brake (caliper or park-brake on the rear) or a driveline/CV joint.** Less likely for a pure hum, but possible. *Check:* the same wheel-temperature test above plus looking for uneven pad wear or a wheel that's hard to turn by hand.

    **Do the swerve test first** — it separates cause 3 from cause 2 and points to the corner, which is the single most useful result you can get cheaply.

    Safety: if the hum comes with vibration through the steering wheel or floor, or a wheel gets very hot, keep speeds low and get it looked at before driving further. If you raise the car, use axle stands under a structural point, never just a jack — a car on a jack can drop.

    Two questions:
    - Which corner was the new hub fitted to — front-left or rear-left?
    - Did the earlier noise disappear after 2026-11-05, and does the new hum sound/behave differently (e.g. is it louder turning one way)?
