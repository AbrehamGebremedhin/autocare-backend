    **First: this is worth investigating promptly but isn't an emergency stop-driving item.** A wheel bearing in early failure hums; if it degrades it can develop play, heat and eventually seize. If the noise suddenly gets much louder, or you feel vibration through the floor or steering, stop and have it looked at before further driving.

    **One test first, because it splits the field**

    Drive at 60 km/h and gently weave left and right. If the hum gets louder turning one way and quieter the other, it's load-sensitive — that points to a bearing. While you're at it, coast at 60 km/h in neutral (or clutch in): if the hum is unchanged, it's wheel-end or driveline; if it disappears with engine speed, it's engine-driven. Also note whether the sound is at the same corner as before or somewhere else.

    **Ranked likely causes**

    1. **A wheel bearing at another corner, or the same corner again** — fits the symptom best: a steady hum that peaks around a specific road speed, independent of engine rpm, is the classic bearing signature. The history records a new hub fitted on the left side on 2026-11-05, so a recently disturbed corner is also a legitimate suspect — wrong or unevenly seated hub, or a bearing damaged on install. *Check:* the weave test above, then jack that corner up (car safely supported on stands, wheels chocked), spin the wheel by hand and listen for roughness or growl, and feel for play at 12 and 6 o'clock and at 3 and 9 o'clock. Compare each wheel to the others. Also feel the hub centre after a drive — a hot hub on one corner only is a bearing sign (careful, it can be hot).

    2. **Tire noise — cupped or feathered tread, or uneven wear left over from the earlier bad bearing** — fits a hum that appears in a narrow speed band and can sound like a bearing. A tire that ran on a failing bearing often wears in a scalloped pattern and keeps humming after the bearing is fixed. *Check:* run your hand slowly around the inside and outside edges of each tread (both directions) and feel for scallops or sawtooth; then rotate the tires front to back and see whether the noise changes character or moves. A change is strong evidence for tires.

    3. **The recently fitted left hub assembly itself** — fits because the noise is described as different from the original one and started after that repair. A bearing damaged during pressing, or an axle nut not torqued correctly, produces a hum that can appear within a short distance. *Check:* I don't have a torque figure for this car in the excerpts, so I can't give you the number — have the axle nut torque verified against the correct spec, and have the hub checked for runout and play.

    4. **Driveline (CV joint or differential/transmission)** — lower on the list: CV joints usually click or knock on full-lock turns rather than hum steadily at 60 km/h. Worth considering only if the coast-in-neutral test changes the noise or the hum is present under acceleration but gone on overrun.

