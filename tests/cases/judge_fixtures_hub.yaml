    A hum that shows up at a steady road speed (around 60 km/h) almost always comes from a wheel-end or tire source, not the engine — noise complaints are frequently traced to the driveline rather than the engine (Haynes Diesel Engine Repair Manual, p. 280). The points below are general guidance, not checked for this car: none of the reference excerpts covers wheel bearing or hub diagnosis, checks or torque figures for a 2001 Echo.

    **One thing to note up front:** a new left-side wheel hub was fitted on 2026-11-05. A noise that appeared after that job makes the repair itself a suspect, alongside the other three wheels. I don't know whether this hum started before or after that date, which changes the ranking a lot — see my questions at the end.

    **Ranked likely causes**

    1. **A wheel bearing on a different corner (e.g. right rear, or a front).** Fits because a bearing hum is speed-dependent, builds steadily from roughly 50–80 km/h, and doesn't care about engine rpm or gear. It also explains "different from before" if the earlier fault was the rear-left. *Check:* at 60 km/h, gently weave left then right. If the hum gets louder when you load one side and quieter when you unload it, that side's bearing is the likely one. Confirm with the car safely on axle stands: spin each wheel by hand and listen/feel for roughness, and rock it at 12-and-6 and 3-and-9 o'clock for play.

    2. **Tire wear or tire damage.** Fits because cupped, feathered or flat-spotted tires hum at a narrow speed band and can sound exactly like a bearing. *Check:* run your hand around each tire's tread (both inner and outer edges) looking for scalloped or sawtooth wear, check pressures, and swap the front and rear wheels — if the noise moves or changes, it's the tires.

    3. **Something disturbed by the 2026-11-05 hub job.** A dust shield or backing plate bent so it just touches the rotor, a brake pad dragging, or wheel nuts not evenly torqued can all produce a steady whirr or hum at speed. Fits because of the timing. *Check:* after a short drive, carefully compare wheel/hub temperatures side to side — a dragging brake or shield contact will be noticeably hotter. Also have the wheel nut torque on that corner verified.

    4. **A dragging brake caliper.** Less likely but worth ruling out: it can hum and will usually also pull slightly or smell hot. Same temperature comparison test as above.

    **What separates them fastest:** the steer-left/steer-right road test (cause 1 versus the rest), then a front-to-rear tire swap (cause 2). Do the lifting checks with the car on axle stands, never on the jack alone.

    **Questions:**
    1. Did this hum start after the 2026-11-05 hub replacement, or was it there before?
    2. Does the sound change when you steer gently left versus right at 60 km/h, or stay exactly the same?
