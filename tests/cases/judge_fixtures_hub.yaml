    A hum that's tied to road speed and shows up in a narrow band around 60 km/h is best pinned down with one test first: at that speed on a quiet straight road, gently weave left and right. If the noise gets louder when you steer one way and quieter or disappears the other way, it's a wheel bearing on the loaded side. If it stays exactly the same, it's more likely a tyre or something else turning with the wheels.

    None of the reference passages covers wheel-bearing or hub noise diagnosis, or the Echo's bearing and tyre details — no spec or procedure for this car is in the excerpts, so the points below are **general guidance, not checked for this car**. The one general point worth keeping: every moving part makes noise, and owners often blame the wrong end of the car for a noise that's actually in the driveline (Haynes Diesel Engine Repair Manual, p. 280).

    **Ranked causes**

    1. **A wheel bearing — the newly fitted left hub, or another corner.** Hum that rises and falls with road speed and changes with steering load is the classic bearing signature. It's also the top suspect because a new hub was fitted on the left side on 2026-11-05, and bearings can be damaged or preloaded wrongly during fitting. *Check:* the weave test above. Noise louder turning right = loaded left side, and vice versa. Then confirm with the wheel off the ground (proper jack and stands, never just a jack) — rock the wheel top-to-bottom and side-to-side and spin it by hand listening for roughness.

    2. **A tyre — cupping, scalloping, feathering, or imbalance.** A worn or unevenly worn tyre hums in a fairly narrow speed band and can sound quite different from a bearing. *Check:* swap wheels front-to-back or side-to-side and drive the same stretch of road. If the noise moves or changes character, it's the tyre.

    3. **Something disturbed during the hub job.** Dust shield or backing plate touching the disc, an ABS sensor or tone ring rubbing, brake drag, or a loose/over-tightened axle nut. This fits a noise that is new after a recent repair on that corner and is often speed-dependent. *Check:* with that wheel off the ground, look for a shiny rub mark on the shield or disc edge, and feel whether that wheel is noticeably harder to turn or hotter after a short drive than the opposite side.

    4. **Exhaust or induction drone.** A hole, a failed gasket or a loose heat shield can produce a hum that appears at one cruising speed. Fits a narrow speed band but not the steering sensitivity. *Check:* coast in neutral at 60 km/h with the engine idling. Noise that vanishes when engine speed drops out of the picture points away from anything that turns with the wheels.

    Nothing here is an immediate stop-driving flag unless the noise is accompanied by vibration through the steering wheel or seat, or the wheel feels loose — in that case stop and get it looked at before driving further.

    Two questions:
    - Does the hum change at all when you steer gently left versus right at 60 km/h, and does it seem to come from the front or the rear?
    - After the hub was fitted on 2026-11-05, did the earlier rear-left noise stop? The history records the repair but not its outcome, so I don't know whether this hum is new or the same corner making a different sound.
