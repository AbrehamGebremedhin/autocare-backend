    Nothing in the reference passages covers wheel-bearing or hub diagnosis for the Echo (no torque figures, no bearing test procedure), so the points below are general guidance, not checked for this car.

    **First, a quick safety check:** because a hub was fitted on the left side on 2026-11-05, verify the wheel nuts on that corner are tight and that the wheel has no play (grab the tyre at 12 and 6 o'clock and rock it with the car on the ground). If there is play, vibration or a wobble, stop driving and have that corner re-checked before anything else.

    **Likely causes, ranked**

    1. **A wheel bearing — either the corner that wasn't replaced, or the new left hub itself.** A hum that appears at a steady road speed like 60 km/h, rises in pitch as you go faster, and doesn't follow engine rpm is the classic bearing signature. With one side renewed, the opposite-side bearing at similar mileage often becomes the one you can now hear, and a newly fitted hub can also be noisy if it was seated incorrectly or is faulty. *Confirm:* at 60 km/h in a safe, empty lane, swerve gently right, then left. If the hum gets louder turning right (weight loading the left side), the left bearing is suspect; louder turning left points to the right side.

    2. **Tyre noise from irregular wear (cupping/feathering).** This also gives a hum in a fairly narrow speed band and is easy to confuse with a bearing, especially after wheel work. *Confirm:* check each tyre's tread for scalloped or saw-toothed blocks and check pressures; swapping the wheels front-to-back and seeing whether the noise moves or changes is the clearest test.

    3. **Transaxle/final-drive bearing or a worn CV joint.** Less likely for a pure steady-speed hum, but worth separating out. Driveline noise usually changes with load — louder accelerating, quieter coasting — whereas a wheel bearing stays roughly constant. *Confirm:* compare the noise under acceleration, steady cruise and coasting in neutral at the same 60 km/h.

    Note that noise travels: a hum you hear from "the car" can originate in the driveline rather than where it seems to come from (Haynes Diesel Engine Repair Manual, p. 280).

    Two questions so I can narrow it down:
