    A speed-related hum that's new and different from the rear-left bearing you already had replaced points first at another bearing, not the same one. Nothing here says stop driving, but a worn wheel bearing gets worse and, neglected long enough, can affect wheel security — get it confirmed soon rather than waiting for it to get loud.

    **Likely causes, ranked**

    1. **Another wheel bearing — right rear or either front.** This best explains a hum that appears in a speed band around 60 km/h, since bearing noise tracks road speed and peaks at a particular range. The left rear bearing already failed, so the others are the same age and mileage, and the new noise being different from before fits a different corner being worn. *Next check:* at 50–70 km/h, steer gently left then right — a bearing gets louder when it's loaded and quieter when unloaded, which also tells you the side. Then, with the car safely on jack stands, spin and rock each wheel for roughness or play.

    2. **Tyre noise (cupped, scalloped or feathered tread, or a tyre moved to a new position).** Fits a hum confined to a narrow speed band that doesn't change when you turn, and it can sound almost identical to a bearing. *Next check:* run your hand across each tread for sawtooth or dished wear, check pressures, then swap wheels front-to-rear and see whether the noise follows the wheel.

    3. **The newly fitted left hub.** A bearing damaged during fitting, a hub nut not torqued to spec, or the backing plate/ABS sensor just touching the tone ring can all give a hum that started after that job — and this is the one cause tied to a recent repair. *Next check:* confirm the ABS light is off and have the hub nut torque and bearing play verified. I couldn't find the Echo's hub or bearing torque spec in the excerpts here, so treat the torque figure as general guidance, not checked for this car.

    4. **Driveshaft/CV or gearbox noise.** Less likely at a steady 60 km/h — CV joints usually click on tight turns — but worth keeping in mind, since noise owners blame on one area often comes from the driveline (Haynes Diesel Engine Repair Manual, p. 280). *Next check:* note whether the hum changes when you lift off the throttle or coast in neutral.

    None of the reference material covers the Echo's wheel bearing or hub procedures, so the checks above are general guidance, not checked for this car. A bearing or hub replacement needs the car properly supported and, depending on the design, a press — a shop job if you don't have stands and a torque wrench.

    Two questions to narrow it down:
    - Did the earlier rear-left hum stop after the hub was fitted on 2026-11-05?
    - Does the new hum change when you steer gently left versus right at that speed?
